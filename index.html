<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter on table</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #000000;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
            background-color: #3a2214;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- โหลดรูปภาพ Assets ---
        const bgImg = new Image();
        bgImg.src = 'bgroom.png';    

        const tableImg = new Image();
        tableImg.src = 'table.png';   

        const letterImg = new Image();
        letterImg.src = 'letter.png'; 

        const playerImg = new Image();
        playerImg.src = 'player.png'; 

        // --- [ปรับปรุงใหม่ให้ตรงกับรูปภาพของคุณ] ---
        const player = {
            x: 270,  
            y: 240, 
            width: 92,         // ขนาดตัวละครที่เหมาะสมเมื่อแสดงผลบนจอเว็บ
            height: 92,
            speed: 3,
            
            // ขนาดช่องจริงในรูปภาพ player.png (ภาพรวมขนาด 150x200 พิกเซล แบ่งเป็น 3x4 ช่อง)
            spriteWidth: 50,   // ความกว้างช่องละ 50 พิกเซลพอดี
            spriteHeight: 50,  // ความสูงช่องละ 50 พิกเซลพอดี
            
            frameX: 1,         // เริ่มต้นที่เฟรม 1 (คอลัมน์กลาง) เพราะเป็นท่ายืนเฉยๆ
            frameY: 0,         // 0 = หันหน้า, 1 = หันซ้าย, 2 = หันขวา, 3 = หันหลัง
            isMoving: false,   
            frameCount: 0,
            walkCycle: 0       // ตัวช่วยนับลำดับการก้าวขา (ซ้าย -> กลาง -> ขวา -> กลาง)
        };

        // --- ตั้งค่าตำแหน่งโต๊ะ ---
        const table = {
            x: 503,   
            y: 152,
            width: 65, 
            height: 172
        };

        // --- ตั้งค่าตำแหน่งจดหมายบนโต๊ะ ---
        const letter = {
            x: 518,      
            y: 220,
            width: 32,   
            height: 42   
        };

        // สิ่งกีดขวาง (ตามแนวเส้นสีแดงและเฟอร์นิเจอร์)
        const obstacles = [
            { x: 0, y: 0, width: 600, height: 150 },     // บล็อกกำแพงบน (เส้นสีแดง)
            { x: 0, y: 365, width: 600, height: 35 },    // กำแพงล่าง
            { x: 0, y: 0, width: 22, height: 400 },      // กำแพงซ้าย
            { x: 578, y: 0, width: 22, height: 400 },    // กำแพงขวา
            { x: 22, y: 150, width: 120, height: 125 },  // เตียงนอน
            { x: 142, y: 150, width: 50, height: 45 },   // ตู้หัวเตียง
            table                                        // ตัวโต๊ะทำงาน
        ];

        const targetURL = "/good.html"; 

        // --- ระบบควบคุมการกดปุ่ม ---
        const keys = {};
        let isNearTable = false; 

        window.addEventListener("keydown", e => {
            if(["space", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
            keys[e.key.toLowerCase()] = true;
        });
        
        window.addEventListener("keyup", e => {
            keys[e.key.toLowerCase()] = false;
        });

        // ฟังก์ชันตรวจจับการชน (ปรับ Hitbox เช็คบริเวณช่วงเท้าตัวละครเพื่อให้เดินเหลื่อมวัตถุได้สมจริง)
        function checkCollision(rect1, rect2) {
            const playerHitbox = {
                x: rect1.x + 10,
                y: rect1.y + rect1.height - 15,
                width: rect1.width - 20,
                height: 15
            };
            return playerHitbox.x < rect2.x + rect2.width &&
                   playerHitbox.x + playerHitbox.width > rect2.x &&
                   playerHitbox.y < rect2.y + rect2.height &&
                   playerHitbox.y + playerHitbox.height > rect2.y;
        }

        function canMoveTo(nextX, nextY) {
            const tempPlayer = { x: nextX, y: nextY, width: player.width, height: player.height };
            for (let obs of obstacles) {
                if (checkCollision(tempPlayer, obs)) {
                    return false; 
                }
            }
            return true; 
        }

        function checkProximity(player, obj) {
            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;
            const objCenterX = obj.x + obj.width / 2;
            const objCenterY = obj.y + obj.height / 2;

            const distanceX = Math.abs(playerCenterX - objCenterX);
            const distanceY = Math.abs(playerCenterY - objCenterY);

            return (distanceX < 85 && distanceY < 100);
        }

        // --- Loop อัปเดตเกม ---
        function update() {
            player.isMoving = false; 

            if (keys["arrowup"] || keys["w"] || keys["ไ"]) {
                if (canMoveTo(player.x, player.y - player.speed)) player.y -= player.speed;
                player.frameY = 3; // แถวที่ 4 ในรูป (หันหลังเดินขึ้น)
                player.isMoving = true;
            }
            else if (keys["arrowdown"] || keys["s"] || keys["ห"]) {
                if (canMoveTo(player.x, player.y + player.speed)) player.y += player.speed;
                player.frameY = 0; // แถวที่ 1 ในรูป (หันหน้าเดินลง)
                player.isMoving = true;
            }
            else if (keys["arrowleft"] || keys["a"] || keys["ฟ"]) {
                if (canMoveTo(player.x - player.speed, player.y)) player.x -= player.speed;
                player.frameY = 1; // แถวที่ 2 ในรูป (หันซ้าย)
                player.isMoving = true;
            }
            else if (keys["arrowright"] || keys["d"] || keys["ก"]) {
                if (canMoveTo(player.x + player.speed, player.y)) player.x += player.speed;
                player.frameY = 2; // แถวที่ 3 ในรูป (หันขวา)
                player.isMoving = true;
            }

            // === ระบบคำนวณแอนิเมชันสำหรับ 3 คอลัมน์ ===
            if (player.isMoving) {
                player.frameCount++;
                if (player.frameCount >= 8) { // ความเร็วในการสับขาเดิน
                    player.walkCycle = (player.walkCycle + 1) % 4;
                    
                    // แปลงลูปเดินจาก 4 จังหวะ ให้ดึงเฟรมรูป 3 ช่อง: 0(ซ้าย) -> 1(กลาง) -> 2(ขวา) -> 1(กลาง)
                    if (player.walkCycle === 0) player.frameX = 0;
                    else if (player.walkCycle === 1 || player.walkCycle === 3) player.frameX = 1;
                    else if (player.walkCycle === 2) player.frameX = 2;

                    player.frameCount = 0;
                }
            } else {
                player.frameX = 1; // [ปรับตามสั่ง] เมื่ออยู่นิ่งๆ ให้กลับมาอยู่แถวกลาง (ท่ายืนนิ่งเฉยๆ)
                player.walkCycle = 0;
            }

            isNearTable = checkProximity(player, table);

            if (isNearTable && keys[" "]) {
                window.location.href = targetURL;
                return; 
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- วาดกราฟิก ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. ฉากหลังห้อง
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

            // 2. โต๊ะทำงาน
            ctx.drawImage(tableImg, table.x, table.y, table.width, table.height);

            // 3. จดหมายบนโต๊ะ
            ctx.drawImage(letterImg, letter.x, letter.y, letter.width, letter.height);

            // 4. วาดตัวละครตามพิกัด 50x50 พิกเซลแบบเป๊ะๆ 
            ctx.drawImage(
                playerImg,
                player.frameX * player.spriteWidth,  // ตัดพิกเซลแกน X ตามจังหวะก้าวขา
                player.frameY * player.spriteHeight, // ตัดพิกเซลแกน Y ตามทิศทางเดิน
                player.spriteWidth, player.spriteHeight, 
                player.x, player.y,                     
                player.width, player.height             
            );

            // 5. แสดงข้อความเตือนเมื่ออยู่ใกล้โต๊ะ
            if (isNearTable) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(table.x - 130, letter.y, 115, 30);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "12px monospace";
                ctx.textAlign = "center";
                ctx.fillText("Press Spacebar", table.x - 72, letter.y + 19);
            }
        }

        playerImg.onload = function() {
            update();
        };
    </script>
</body>
</html>
